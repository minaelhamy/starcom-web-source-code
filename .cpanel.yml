---
deployment:
  tasks:
    - export REPOPATH=/home/shargtvh/repositories/starcom-web-source-code
    - export APPPATH=/home/shargtvh/starcom-web-source-code
    - export PUBLICPATH=/home/shargtvh/public_html
    - /bin/mkdir -p $APPPATH
    - /bin/mkdir -p $PUBLICPATH
    - /bin/mkdir -p $APPPATH/bootstrap/cache
    - /bin/mkdir -p $APPPATH/storage/framework/cache
    - /bin/mkdir -p $APPPATH/storage/framework/sessions
    - /bin/mkdir -p $APPPATH/storage/framework/views
    - /bin/mkdir -p $APPPATH/storage/logs
    - /usr/bin/rsync -a --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r --exclude '.git' --exclude '.github' --exclude '.cpanel.yml' --exclude '.DS_Store' --exclude '.env' --exclude '.env.local' --exclude '.env.production' --exclude 'AGENTS.md' --exclude 'vendor/' --exclude 'node_modules/' --exclude 'bootstrap/cache/' --exclude 'storage/' --exclude 'public/storage/' --exclude 'public/file/' --exclude 'error_log' --exclude 'php/error_log' "./starcom webstore/" $APPPATH/
    - /bin/chmod -R 775 $APPPATH/bootstrap/cache $APPPATH/storage
    - /bin/bash -lc 'if command -v composer >/dev/null 2>&1; then cd /home/shargtvh/starcom-web-source-code && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist; elif [ -x /opt/cpanel/composer/bin/composer ]; then cd /home/shargtvh/starcom-web-source-code && /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist; else echo "Composer not found on PATH; keeping existing vendor directory."; fi'
    - /bin/bash -lc 'cd /home/shargtvh/starcom-web-source-code && php artisan migrate --force'
    - /bin/rm -rf $PUBLICPATH/build
    - /bin/cp -R $APPPATH/public/build $PUBLICPATH/build
    - /bin/cp $APPPATH/public/.htaccess $PUBLICPATH/.htaccess
    - /bin/cp $APPPATH/public/index.php $PUBLICPATH/index.php
    - /bin/rm -rf $PUBLICPATH/images
    - /bin/cp -R $APPPATH/public/images $PUBLICPATH/images
    - /bin/rm -rf $PUBLICPATH/themes
    - /bin/cp -R $APPPATH/public/themes $PUBLICPATH/themes
    - /bin/bash -lc 'cd /home/shargtvh/starcom-web-source-code && php artisan optimize:clear'
    - /bin/bash -lc 'cd /home/shargtvh/starcom-web-source-code && php artisan config:cache'
    - /bin/bash -lc 'cd /home/shargtvh/starcom-web-source-code && php artisan view:cache'
